services:
  postgres-test:
    image: postgres:15-alpine
    networks:
      - app-network
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: 1234

    volumes:
      - "db:/var/lib/postgresql/data"


  redis-test:
    image: redis:7.4.2-alpine
    networks:
      - app-network
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  db:
  redis_data:

networks:
  app-network:
    driver: bridge
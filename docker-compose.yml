services:
  postgres:
    image: postgres:15-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: hh
      POSTGRES_USER: hh
      POSTGRES_PASSWORD: 1234
    volumes:
      - "db:/var/lib/postgresql/data"


  redis:
    image: redis:7.4.2-alpine
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  db:
  redis_data:
